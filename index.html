
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-icon">✓</div>
        <div>
            <h2>PATHFIT-1</h2>
            <p>BSCS-1A Attendance System</p>
        </div>
    </div>
</header>

<main class="container">

    <section class="page-title">
        <h1>Student Attendance</h1>
        <p>Manage and monitor student attendance records.</p>
    </section>

    <section class="controls">

        <div class="input-group">
            <label for="program">Program / Section</label>
            <input type="text" id="program" value="BSCS-1A">
        </div>

        <div class="input-group">
            <label for="attendanceDate">Date</label>
            <input type="date" id="attendanceDate">
        </div>

        <div class="input-group">
            <label for="attendancePeriod">Attendance Period</label>
            <select id="attendancePeriod" onchange="changePeriod()">
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Evening">Evening</option>
            </select>
        </div>

        <div class="input-group">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName"
                   placeholder="Enter student name">
        </div>

        <button class="btn btn-primary" onclick="addStudent()">
            Add Student
        </button>

        <button class="btn btn-success" onclick="markAllPresent()">
            Mark All Present
        </button>

    </section>

    <section class="stats">

        <div class="stat-card">
            <p>Total Students</p>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="stat-card present">
            <p>Present</p>
            <h2 id="presentCount">0</h2>
        </div>

        <div class="stat-card late">
            <p>Late</p>
            <h2 id="lateCount">0</h2>
        </div>

        <div class="stat-card absent">
            <p>Absent</p>
            <h2 id="absentCount">0</h2>
        </div>

        <div class="stat-card excuse">
            <p>Excuse</p>
            <h2 id="excuseCount">0</h2>
        </div>

    </section>

    <section class="records">

        <div class="records-header">
            <div>
                <h2>Student Records</h2>
                <p id="periodLabel">Morning Attendance</p>
            </div>

            <div class="actions">
                <input type="text" id="searchInput"
                       placeholder="Search student..."
                       oninput="searchStudents()">

                <button class="btn btn-secondary" onclick="window.print()">
                    Print
                </button>

                <button class="btn btn-primary" onclick="exportCSV()">
                    Export CSV
                </button>

                <button class="btn btn-danger" onclick="clearAttendance()">
                    Clear
                </button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student Name</th>
                        <th>Status</th>
                        <th>Time</th>
                        <th>Remarks</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable"></tbody>
            </table>
        </div>

    </section>

</main>


</body>
</html>

<script>
	
const rosterKey = "attendanceRoster";

let students = [];
let attendance = [];

const dateInput = document.getElementById("attendanceDate");
const periodSelect = document.getElementById("attendancePeriod");
const studentTable = document.getElementById("studentTable");

function getToday() {
    const date = new Date();
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function getRecordKey() {
    return `attendanceRecords_${dateInput.value}_${periodSelect.value}`;
}

function readStorage(key, fallback) {
    try {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : fallback;
    } catch {
        return fallback;
    }
}

function saveRoster() {
    localStorage.setItem(rosterKey, JSON.stringify(students));
}

function saveData() {
    localStorage.setItem(getRecordKey(), JSON.stringify(attendance));
}

function getTime() {
    return new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });
}

function loadStudents() {
    students = readStorage(rosterKey, []);

    if (students.length === 0) {
        const oldData = readStorage("attendanceStudents", []);

        if (oldData.length > 0) {
            students = oldData.map((student, index) => ({
                id: student.id || Date.now() + index,
                name: student.name
            }));

            saveRoster();

            const migrated = students.map((student, index) => ({
                id: student.id,
                status: oldData[index].status || "Pending",
                time: oldData[index].time || "--",
                remarks: oldData[index].remarks || ""
            }));

            localStorage.setItem(getRecordKey(), JSON.stringify(migrated));
        }
    }

    loadAttendance();
}

function loadAttendance() {
    const saved = readStorage(getRecordKey(), []);

    attendance = students.map(student => {
        const record = saved.find(item => item.id === student.id);

        return record || {
            id: student.id,
            status: "Pending",
            time: "--",
            remarks: ""
        };
    });

    renderStudents();
}

function renderStudents() {
    studentTable.innerHTML = "";

    students.forEach((student, index) => {
        const record = attendance.find(item => item.id === student.id);

        if (!record) return;

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${index + 1}</td>

            <td>${escapeHTML(student.name)}</td>

            <td>
                <select class="status-select"
                    onchange="changeStatus(${student.id}, this.value)">
                    ${["Pending", "Present", "Late", "Absent", "Excuse"]
                        .map(status => `
                            <option value="${status}"
                                ${record.status === status ? "selected" : ""}>
                                ${status}
                            </option>
                        `).join("")}
                </select>
            </td>

            <td>${escapeHTML(record.time)}</td>

            <td>
                <input class="remark-input"
                    value="${escapeAttribute(record.remarks)}"
                    placeholder="Remarks"
                    onchange="updateRemark(${student.id}, this.value)">
            </td>

            <td>
                <button class="action-btn edit-btn"
                    onclick="editStudentName(${student.id})">
                    Edit
                </button>

                <button class="action-btn"
                    onclick="deleteStudent(${student.id})">
                    Delete
                </button>
            </td>
        `;

        studentTable.appendChild(row);
    });

    updateStats();
    updatePeriodLabel();
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[character]);
}

function escapeAttribute(value) {
    return escapeHTML(value);
}

function updatePeriodLabel() {
    document.getElementById("periodLabel").textContent =
        `${periodSelect.value} Attendance - ${dateInput.value}`;
}

function addStudent() {
    const nameInput = document.getElementById("studentName");
    const name = nameInput.value.trim();

    if (!name) {
        alert("Please enter a student name.");
        return;
    }

    const exists = students.some(student =>
        student.name.toLowerCase() === name.toLowerCase()
    );

    if (exists) {
        alert("This student already exists.");
        return;
    }

    const student = {
        id: Date.now(),
        name: name
    };

    students.push(student);

    attendance.push({
        id: student.id,
        status: "Pending",
        time: "--",
        remarks: ""
    });

    saveRoster();
    saveData();

    nameInput.value = "";
    renderStudents();
}

function changeStatus(id, status) {
    const record = attendance.find(item => item.id === id);

    if (!record) return;

    record.status = status;
    record.time = status === "Pending" ? "--" : getTime();

    saveData();
    renderStudents();
}

function updateRemark(id, remark) {
    const record = attendance.find(item => item.id === id);

    if (!record) return;

    record.remarks = remark;
    saveData();
}

function editStudentName(id) {
    const student = students.find(item => item.id === id);

    if (!student) return;

    const newName = prompt("Enter new student name:", student.name);

    if (newName === null) return;

    const cleanName = newName.trim();

    if (!cleanName) {
        alert("Student name cannot be empty.");
        return;
    }

    const duplicate = students.some(item =>
        item.id !== id &&
        item.name.toLowerCase() === cleanName.toLowerCase()
    );

    if (duplicate) {
        alert("That student name already exists.");
        return;
    }

    student.name = cleanName;

    saveRoster();
    renderStudents();
}

function deleteStudent(id) {
    const student = students.find(item => item.id === id);

    if (!student) return;

    if (!confirm(`Delete ${student.name} from all attendance records?`)) {
        return;
    }

    students = students.filter(item => item.id !== id);

    saveRoster();

    Object.keys(localStorage).forEach(key => {
        if (key.startsWith("attendanceRecords_")) {
            const records = readStorage(key, []);
            const updated = records.filter(item => item.id !== id);

            localStorage.setItem(key, JSON.stringify(updated));
        }
    });

    attendance = attendance.filter(item => item.id !== id);

    renderStudents();
}

function markAllPresent() {
    if (students.length === 0) {
        alert("There are no students to mark.");
        return;
    }

    if (!confirm("Mark all students as Present for this period?")) {
        return;
    }

    attendance.forEach(record => {
        record.status = "Present";
        record.time = getTime();
    });

    saveData();
    renderStudents();
}

function clearAttendance() {
    if (!confirm("Reset attendance for this date and period?")) {
        return;
    }

    attendance.forEach(record => {
        record.status = "Pending";
        record.time = "--";
        record.remarks = "";
    });

    saveData();
    renderStudents();
}

function searchStudents() {
    const search = document.getElementById("searchInput")
        .value.toLowerCase();

    const rows = studentTable.querySelectorAll("tr");

    rows.forEach(row => {
        const name = row.cells[1].textContent.toLowerCase();

        row.style.display = name.includes(search) ? "" : "none";
    });
}

function updateStats() {
    document.getElementById("totalStudents").textContent =
        students.length;

    document.getElementById("presentCount").textContent =
        attendance.filter(item => item.status === "Present").length;

    document.getElementById("lateCount").textContent =
        attendance.filter(item => item.status === "Late").length;

    document.getElementById("absentCount").textContent =
        attendance.filter(item => item.status === "Absent").length;

    document.getElementById("excuseCount").textContent =
        attendance.filter(item => item.status === "Excuse").length;
}

function changePeriod() {
    loadAttendance();
}

function exportCSV() {
    const rows = [
        ["Date", "Period", "Student No", "Student Name",
         "Status", "Time", "Remarks"]
    ];

    students.forEach((student, index) => {
        const record = attendance.find(item => item.id === student.id);

        rows.push([
            dateInput.value,
            periodSelect.value,
            index + 1,
            student.name,
            record ? record.status : "Pending",
            record ? record.time : "--",
            record ? record.remarks : ""
        ]);
    });

    const csv = rows.map(row =>
        row.map(value =>
            `"${String(value).replace(/"/g, '""')}"`
        ).join(",")
    ).join("\n");

    const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download =
        `Attendance_${dateInput.value}_${periodSelect.value}.csv`;

    link.click();

    URL.revokeObjectURL(url);
}

dateInput.addEventListener("change", () => {
    loadAttendance();
});

document.getElementById("studentName").addEventListener("keydown", event => {
    if (event.key === "Enter") {
        addStudent();
    }
});

dateInput.value = getToday();
loadStudents();

</script>
